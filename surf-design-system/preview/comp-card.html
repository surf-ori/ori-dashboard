<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Content card</div>
  <div style="display:flex; gap:14px">
    <div style="flex:1; background:#fff; border:1px solid #ECECEC; border-radius:16px; padding:20px;">
      <div style="font:600 11px/1 var(--font-body); letter-spacing:0.08em; text-transform:uppercase; color:#E67300; margin-bottom:8px">Dienst</div>
      <h3 style="font:800 19px/1.2 var(--font-display); margin:0 0 6px">SURFconext</h3>
      <p style="font:400 14px/1.5 var(--font-body); color:#3A3A3A; margin:0 0 14px">Met één account toegang tot honderden onderwijs- en onderzoeksdiensten.</p>
      <a style="font:700 14px/1 var(--font-body); color:#E67300; text-decoration:none">Meer informatie →</a>
    </div>
    <div style="flex:1; background:#fff; border:1px solid #ECECEC; border-radius:16px; padding:20px; box-shadow:0 4px 14px rgba(0,0,0,0.08)">
      <div style="font:600 11px/1 var(--font-body); letter-spacing:0.08em; text-transform:uppercase; color:#0077C0; margin-bottom:8px">Onderzoek</div>
      <h3 style="font:800 19px/1.2 var(--font-display); margin:0 0 6px">Snellius supercomputer</h3>
      <p style="font:400 14px/1.5 var(--font-body); color:#3A3A3A; margin:0 0 14px">Rekenkracht voor Nederlandse wetenschappers — van fysica tot biologie.</p>
      <a style="font:700 14px/1 var(--font-body); color:#E67300; text-decoration:none">Aanvragen →</a>
    </div>
  </div>
</div></body></html>
