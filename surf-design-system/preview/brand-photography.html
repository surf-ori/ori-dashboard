<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Photography — examples from surf.nl</div>
  <div style="display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:10px; height:180px;">
    <div style="border-radius:20px; overflow:hidden; position:relative; background:#2b2b2b">
      <img src="https://www.surf.nl/files/styles/paragraph_image_narrow/public/2025-06/surf_uva_sept2024_157.jpg?h=adef3c95&itok=kihF1np8"
           alt="Groep mensen die weg loopt van de camera"
           style="width:100%; height:100%; object-fit:cover; display:block">
      <div style="position:absolute; bottom:10px; left:12px; font:700 12px/1 var(--font-body); color:#fff; background:rgba(0,0,0,0.55); padding:6px 10px; border-radius:6px">UvA · campus</div>
    </div>
    <div style="border-radius:20px; overflow:hidden; position:relative; background:#2b2b2b">
      <img src="https://www.surf.nl/files/styles/scrollable_item/public/2026-03/surf_eveline_crone_9.jpg?h=fafc5eda&itok=T3qS1pCR"
           alt="Portret van Eveline Crone"
           style="width:100%; height:100%; object-fit:cover; display:block">
      <div style="position:absolute; bottom:10px; left:12px; font:700 12px/1 var(--font-body); color:#fff; background:rgba(0,0,0,0.55); padding:6px 10px; border-radius:6px">Portret</div>
    </div>
    <div style="border-radius:20px; overflow:hidden; position:relative; background:#2b2b2b">
      <img src="https://www.surf.nl/files/styles/scrollable_item/public/2025-12/surf_eur_dec2025_98.jpg?h=a5f3641b&itok=VwFCJl1I"
           alt="Studenten op computerwerkplekken"
           style="width:100%; height:100%; object-fit:cover; display:block">
      <div style="position:absolute; bottom:10px; left:12px; font:700 12px/1 var(--font-body); color:#fff; background:rgba(0,0,0,0.55); padding:6px 10px; border-radius:6px">EUR · werkplek</div>
    </div>
  </div>
  <div style="margin-top:10px; font:400 12px/1.4 var(--font-body); color:#6B6B6B">
    Warm natural light · real students &amp; researchers in‑situ · candid action shots and grounded portraits · no heavy filtering.
  </div>
</div></body></html>
