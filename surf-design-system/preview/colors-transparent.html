<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">80% transparent overlays</div>
  <div style="position:relative; border-radius:14px; overflow:hidden; height:160px;
              background:
                linear-gradient(135deg, #2b2b2b 0%, #555 50%, #888 100%);">
    <!-- mimic a photo with diagonal bands -->
    <div style="position:absolute;inset:0;
                background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 20px, rgba(0,0,0,0.05) 20px 40px);"></div>
    <div style="position:absolute; inset:14px; display:flex; gap:8px;">
      <div style="flex:1; background:rgba(230,115,0,0.8);  border-radius:8px; display:flex; align-items:flex-end; padding:8px; color:#fff; font:700 11px/1 'Nunito',sans-serif">Oranje 80%</div>
      <div style="flex:1; background:rgba(223,50,38,0.8);  border-radius:8px; display:flex; align-items:flex-end; padding:8px; color:#fff; font:700 11px/1 'Nunito',sans-serif">Rood 80%</div>
      <div style="flex:1; background:rgba(0,119,192,0.8);  border-radius:8px; display:flex; align-items:flex-end; padding:8px; color:#fff; font:700 11px/1 'Nunito',sans-serif">Blauw 80%</div>
      <div style="flex:1; background:rgba(0,137,66,0.8);   border-radius:8px; display:flex; align-items:flex-end; padding:8px; color:#fff; font:700 11px/1 'Nunito',sans-serif">Groen 80%</div>
      <div style="flex:1; background:rgba(119,37,131,0.8); border-radius:8px; display:flex; align-items:flex-end; padding:8px; color:#fff; font:700 11px/1 'Nunito',sans-serif">Paars 80%</div>
    </div>
  </div>
</div></body></html>
