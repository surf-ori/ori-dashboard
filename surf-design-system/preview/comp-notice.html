<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Notice / status</div>
  <div style="display:flex; flex-direction:column; gap:10px; font-family:var(--font-body)">
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#E5F4EA; border-left:4px solid #008942; border-radius:6px">
      <div style="font:700 14px/1.4; color:#005d2d">Beschikbaar — alle diensten draaien zonder problemen.</div>
    </div>
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#E3F1FB; border-left:4px solid #0077C0; border-radius:6px">
      <div style="font:700 14px/1.4; color:#004f80">Onderhoud gepland voor donderdag 14 mei van 22:00 tot 04:00.</div>
    </div>
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#FFF8DC; border-left:4px solid #E6B800; border-radius:6px">
      <div style="font:700 14px/1.4; color:#735900">Sommige instellingen kunnen vertraging ervaren in SURFmailfilter.</div>
    </div>
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#FDE9E7; border-left:4px solid #DF3226; border-radius:6px">
      <div style="font:700 14px/1.4; color:#8a1c14">Storing in SURFsharekit — we werken aan een oplossing.</div>
    </div>
  </div>
</div></body></html>
