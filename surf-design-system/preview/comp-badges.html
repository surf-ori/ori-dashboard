<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Tags & badges</div>
  <div style="display:flex; gap:8px; flex-wrap:wrap; font-family:var(--font-body); font-weight:600; font-size:13px">
    <span style="padding:5px 12px; background:#FFF3E3; color:#B85B00; border-radius:999px">Onderzoek</span>
    <span style="padding:5px 12px; background:#E3F1FB; color:#0077C0; border-radius:999px">Onderwijs</span>
    <span style="padding:5px 12px; background:#E5F4EA; color:#008942; border-radius:999px">Beschikbaar</span>
    <span style="padding:5px 12px; background:#FDE9E7; color:#DF3226; border-radius:999px">Onderhoud</span>
    <span style="padding:5px 12px; background:#F2E6F4; color:#772583; border-radius:999px">Pilot</span>
    <span style="padding:5px 12px; background:#000; color:#fff; border-radius:999px">SURF</span>
  </div>
  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; font-family:var(--font-body); font-weight:600; font-size:12px">
    <span style="padding:4px 10px; background:#E67300; color:#fff; border-radius:4px; text-transform:uppercase; letter-spacing:0.06em">Nieuw</span>
    <span style="padding:4px 10px; background:#000; color:#fff; border-radius:4px; text-transform:uppercase; letter-spacing:0.06em">Beta</span>
    <span style="padding:4px 10px; background:#fff; color:#000; border:1px solid #000; border-radius:4px; text-transform:uppercase; letter-spacing:0.06em">Tip</span>
  </div>
</div></body></html>
