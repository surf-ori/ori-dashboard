<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Form inputs</div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
    <label style="display:flex; flex-direction:column; gap:6px; font:600 12px/1 var(--font-body); color:#3A3A3A">
      E-mailadres
      <input value="naam@instelling.nl" style="padding:11px 14px; border:1px solid #D9D9D9; border-radius:8px; font:400 15px/1 var(--font-body); color:#000; outline:none">
    </label>
    <label style="display:flex; flex-direction:column; gap:6px; font:600 12px/1 var(--font-body); color:#3A3A3A">
      Instelling
      <select style="padding:11px 14px; border:1px solid #D9D9D9; border-radius:8px; font:400 15px/1 var(--font-body); color:#000; background:#fff">
        <option>Universiteit Utrecht</option><option>TU Delft</option>
      </select>
    </label>
    <label style="display:flex; flex-direction:column; gap:6px; font:600 12px/1 var(--font-body); color:#3A3A3A">
      Focus state
      <input value="Met focus" style="padding:11px 14px; border:1px solid #E67300; box-shadow:0 0 0 2px rgba(230,115,0,0.25); border-radius:8px; font:400 15px/1 var(--font-body); color:#000; outline:none">
    </label>
    <label style="display:flex; flex-direction:column; gap:6px; font:600 12px/1 var(--font-body); color:#DF3226">
      Foutmelding
      <input value="ongeldige invoer" style="padding:11px 14px; border:1px solid #DF3226; border-radius:8px; font:400 15px/1 var(--font-body); color:#000; outline:none">
    </label>
  </div>
</div></body></html>
