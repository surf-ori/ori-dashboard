<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Semantic / status</div>
  <div class="row" style="gap:8px">
    <div class="swatch dark"  style="background:#008942; flex:1"><div class="name">Success</div><div class="hex">--status-success</div></div>
    <div class="swatch dark"  style="background:#0077C0; flex:1"><div class="name">Info</div><div class="hex">--status-info</div></div>
    <div class="swatch light" style="background:#FEDB00; flex:1"><div class="name">Warning</div><div class="hex">--status-warning</div></div>
    <div class="swatch dark"  style="background:#DF3226; flex:1"><div class="name">Error</div><div class="hex">--status-error</div></div>
  </div>
  <div class="row" style="gap:8px; margin-top:8px">
    <div class="swatch light" style="background:#FFFFFF; flex:1; border:1px solid #D9D9D9"><div class="name">bg-1</div><div class="hex">#FFFFFF</div></div>
    <div class="swatch light" style="background:#F5F5F5; flex:1"><div class="name">bg-2</div><div class="hex">#F5F5F5</div></div>
    <div class="swatch light" style="background:#ECECEC; flex:1"><div class="name">bg-3</div><div class="hex">#ECECEC</div></div>
    <div class="swatch dark"  style="background:#000000; flex:1"><div class="name">bg-inverse</div><div class="hex">#000000</div></div>
  </div>
</div></body></html>
