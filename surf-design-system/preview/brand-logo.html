<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Logo · official mark</div>
  <div style="display:grid; grid-template-columns: 1.4fr 1fr 1fr; gap:14px; align-items:stretch">
    <div style="background:#fff; border:1px solid #ECECEC; border-radius:14px; padding:22px; display:flex; align-items:center; justify-content:center">
      <img src="../assets/logo/SURF_fc.svg" alt="SURF" style="height:84px; display:block">
    </div>
    <div style="background:#000; border-radius:14px; padding:22px; display:flex; align-items:center; justify-content:center">
      <img src="../assets/logo/SURF_diap.svg" alt="SURF" style="height:60px; display:block; filter: invert(1)">
    </div>
    <div style="background:#E67300; border-radius:14px; padding:22px; display:flex; align-items:center; justify-content:center">
      <img src="../assets/logo/SURF_diap.svg" alt="SURF" style="height:60px; display:block; filter: invert(1)">
    </div>
  </div>
  <div style="margin-top:10px; font:400 12px/1.4 var(--font-body); color:#6B6B6B">
    <b>SURF_fc</b> — full mark with the signature curl (use on light backgrounds).
    <b>SURF_diap</b> — wordmark only, intended for dark/photographic backgrounds.
  </div>
</div></body></html>
