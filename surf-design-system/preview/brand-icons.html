<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body><div class="card">
  <div class="label-eyebrow">Icons — Lucide (stand-in for SURF set)</div>
  <div style="display:grid; grid-template-columns:repeat(10,1fr); gap:14px; align-items:center; color:#E67300">
    <i data-lucide="graduation-cap"></i>
    <i data-lucide="book-open"></i>
    <i data-lucide="cpu"></i>
    <i data-lucide="server"></i>
    <i data-lucide="cloud"></i>
    <i data-lucide="shield-check"></i>
    <i data-lucide="users"></i>
    <i data-lucide="key-round"></i>
    <i data-lucide="globe"></i>
    <i data-lucide="microscope"></i>
  </div>
  <div style="display:grid; grid-template-columns:repeat(10,1fr); gap:14px; align-items:center; color:#000; margin-top:14px">
    <i data-lucide="arrow-right"></i>
    <i data-lucide="download"></i>
    <i data-lucide="search"></i>
    <i data-lucide="settings"></i>
    <i data-lucide="mail"></i>
    <i data-lucide="play"></i>
    <i data-lucide="file-text"></i>
    <i data-lucide="link"></i>
    <i data-lucide="check"></i>
    <i data-lucide="x"></i>
  </div>
  <div style="margin-top:12px; font:400 12px/1.4 var(--font-body); color:#6B6B6B">
    2px stroke, rounded line endings — matches SURF's flat orange/black line style. Substitute with official SURF set when available.
  </div>
  <script>lucide.createIcons({attrs:{'stroke-width':2, width:24, height:24}});</script>
</div></body></html>
