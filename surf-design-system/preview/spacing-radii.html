<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Corner radii</div>
  <div style="display:flex; gap:14px; align-items:flex-end; font-family:var(--font-body)">
    <div style="text-align:center"><div style="width:60px; height:60px; background:#FFF3E3; border:1px solid #F4A95A; border-radius:4px"></div><div style="font:600 11px/1.4; color:#6B6B6B; margin-top:6px">xs<br>4px</div></div>
    <div style="text-align:center"><div style="width:60px; height:60px; background:#FFF3E3; border:1px solid #F4A95A; border-radius:8px"></div><div style="font:600 11px/1.4; color:#6B6B6B; margin-top:6px">sm<br>8px</div></div>
    <div style="text-align:center"><div style="width:60px; height:60px; background:#FFF3E3; border:1px solid #F4A95A; border-radius:12px"></div><div style="font:600 11px/1.4; color:#6B6B6B; margin-top:6px">md<br>12px</div></div>
    <div style="text-align:center"><div style="width:60px; height:60px; background:#FFF3E3; border:1px solid #F4A95A; border-radius:20px"></div><div style="font:600 11px/1.4; color:#6B6B6B; margin-top:6px">lg<br>20px</div></div>
    <div style="text-align:center"><div style="width:60px; height:60px; background:#FFF3E3; border:1px solid #F4A95A; border-radius:32px"></div><div style="font:600 11px/1.4; color:#6B6B6B; margin-top:6px">xl<br>32px</div></div>
    <div style="text-align:center"><div style="width:90px; height:34px; background:#FFF3E3; border:1px solid #F4A95A; border-radius:999px"></div><div style="font:600 11px/1.4; color:#6B6B6B; margin-top:6px">pill<br>999px</div></div>
  </div>
  <div style="margin-top:14px; font:400 13px/1.4 var(--font-body); color:#6B6B6B; max-width:55ch">
    The <b>basiskader</b> — SURF's signature frame — uses <code>lg</code>–<code>xl</code> (20–32px) with a 4px black border.
  </div>
</div></body></html>
