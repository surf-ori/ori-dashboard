<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Basiskader — brand frame</div>
  <div style="display:flex; gap:16px; align-items:stretch;">
    <div style="flex:1; border:4px solid #000; border-radius:24px; padding:0; min-height:160px; position:relative; overflow:hidden; background:#2b2b2b;">
      <img src="https://www.surf.nl/files/styles/paragraph_image_narrow/public/2025-06/surf_uva_sept2024_157.jpg?h=adef3c95&itok=kihF1np8"
           alt="Groep mensen op de campus"
           style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
      <div style="position:absolute; inset:0; background: linear-gradient(110deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 50%, transparent 70%);"></div>
      <div style="position:relative; padding:18px; max-width:62%">
        <div style="font:900 22px/1.1 var(--font-display); color:#fff; letter-spacing:-0.01em">Samen aanjagen<br>van vernieuwing.</div>
        <div style="display:inline-flex; align-items:center; margin-top:10px; padding:6px 12px; background:#E67300; border-radius:8px">
          <img src="../assets/logo/SURF_diap.svg" alt="SURF" style="height:14px; filter:invert(1)">
        </div>
      </div>
    </div>
    <div style="width:140px; border:4px solid #000; border-radius:24px; padding:14px; background:#E67300; color:#fff; display:flex; flex-direction:column; justify-content:space-between">
      <img src="../assets/logo/SURF_diap.svg" alt="SURF" style="height:18px; filter:invert(1)">
      <div style="font:900 18px/1.05 var(--font-display); letter-spacing:-0.01em">Voor onderwijs en onderzoek.</div>
    </div>
  </div>
  <div style="margin-top:10px; font:400 12px/1.4 var(--font-body); color:#6B6B6B">
    4px black border · radius 24–32px · content layered with orange accent + photography.
  </div>
</div></body></html>
