<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Navigation</div>
  <div style="display:flex; align-items:center; gap:32px; padding:14px 18px; background:#fff; border:1px solid #ECECEC; border-radius:12px; font-family:var(--font-body)">
    <img src="../assets/logo/SURF_fc.svg" alt="SURF" style="height:36px; display:block">
    <nav style="display:flex; gap:24px; font:600 14px/1; color:#000">
      <span style="position:relative">Richtlijnen<span style="position:absolute; left:0; right:0; bottom:-18px; height:3px; background:#E67300; border-radius:2px"></span></span>
      <span style="color:#3A3A3A">Basiselementen</span>
      <span style="color:#3A3A3A">Downloads</span>
      <span style="color:#3A3A3A">Over SURF</span>
    </nav>
    <div style="margin-left:auto; display:flex; gap:10px; align-items:center">
      <div style="padding:7px 12px; border:1px solid #D9D9D9; border-radius:999px; font:400 13px/1; color:#6B6B6B">Zoeken…</div>
      <button style="all:unset; cursor:pointer; padding:9px 16px; background:#E67300; color:#fff; font:700 13px/1; border-radius:8px">Inloggen</button>
    </div>
  </div>
</div></body></html>
