<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Elevation — shadows</div>
  <div style="display:flex; gap:24px; padding:14px 6px; background:#F5F5F5; border-radius:10px">
    <div style="flex:1; height:80px; background:#fff; border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,0.06); display:flex; align-items:flex-end; padding:10px; font:600 12px/1 var(--font-body); color:#6B6B6B">sm</div>
    <div style="flex:1; height:80px; background:#fff; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,0.08); display:flex; align-items:flex-end; padding:10px; font:600 12px/1 var(--font-body); color:#6B6B6B">md</div>
    <div style="flex:1; height:80px; background:#fff; border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.12); display:flex; align-items:flex-end; padding:10px; font:600 12px/1 var(--font-body); color:#6B6B6B">lg</div>
  </div>
</div></body></html>
