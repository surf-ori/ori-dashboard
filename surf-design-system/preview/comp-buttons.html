<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="label-eyebrow">Buttons</div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center">
    <button style="all:unset; cursor:pointer; padding:12px 22px; background:#E67300; color:#fff; font:700 15px/1 var(--font-body); border-radius:10px">Primair</button>
    <button style="all:unset; cursor:pointer; padding:12px 22px; background:#000; color:#fff; font:700 15px/1 var(--font-body); border-radius:10px">Secundair</button>
    <button style="all:unset; cursor:pointer; padding:11px 21px; background:#fff; color:#000; border:1px solid #000; font:700 15px/1 var(--font-body); border-radius:10px">Outline</button>
    <button style="all:unset; cursor:pointer; padding:12px 4px; color:#E67300; font:700 15px/1 var(--font-body); border-radius:4px">Tekstlink →</button>
  </div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:14px">
    <button style="all:unset; cursor:pointer; padding:8px 14px; background:#E67300; color:#fff; font:700 13px/1 var(--font-body); border-radius:8px">Small</button>
    <button style="all:unset; cursor:pointer; padding:14px 26px; background:#E67300; color:#fff; font:700 17px/1 var(--font-body); border-radius:12px">Large</button>
    <button disabled style="all:unset; padding:12px 22px; background:#E67300; color:#fff; font:700 15px/1 var(--font-body); border-radius:10px; opacity:0.5">Disabled</button>
  </div>
</div></body></html>
